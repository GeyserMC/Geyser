name: Publish NetherNet ingress

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Geyser-Spigot
        run: ./gradlew :spigot:shadowJar --no-daemon

      - name: Publish release asset
        uses: ncipollo/release-action@v1
        with:
          tag: nethernet-ingress-2
          name: NetherNet Ingress 2
          body: |
            RPC-signaling NetherNet ingress for the paired MCXboxBroadcast publisher.

            The Geyser JAR owns the Bedrock/NetherNet gameplay connection. Pair it with
            the MCXboxBroadcast artifacts from the Broadcaster Build 2 release.
          artifacts: bootstrap/spigot/build/libs/Geyser-Spigot.jar
          allowUpdates: true
          removeArtifacts: true
          draft: false
          prerelease: false
